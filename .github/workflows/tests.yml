name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push supersedes the run it interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the python list in step with the "Programming Language :: Python ::
  # 3.X" classifiers and requires-python in pyproject.toml.
  test:
    name: test (${{ matrix.python }}, ${{ matrix.deps }} deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        deps: [locked]
        include:
          # The declared dependency floors, on the oldest supported Python.
          - python: "3.8"
            deps: lowest
    steps:
      - uses: actions/checkout@v7

      # Exact pin, not a floating major: astral-sh/setup-uv stopped publishing
      # major tags after v7, so `@v10` does not resolve.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}

      # --locked fails if uv.lock has drifted from pyproject.toml.
      - name: Install dependencies
        if: ${{ matrix.deps == 'locked' }}
        run: uv sync --locked --all-groups

      # lowest-direct would also pick the oldest (unpinned) test tools, so
      # install the package at its dependency floors first, then add the dev
      # group, which leaves the already-satisfied floors alone.
      - name: Install lowest declared dependencies
        if: ${{ matrix.deps == 'lowest' }}
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e .
          uv pip install --group dev
          uv pip list

      # Enforces 100% coverage (pyproject) on every leg and writes
      # coverage.xml.
      - name: Test
        run: uv run --no-sync pytest

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.python }}-${{ matrix.deps }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Build docs
        run: uv run sphinx-build -a -n -W -b html docs/source docs/build/html

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t ecsjobs:ci .

      - name: Smoke test
        run: dev/docker_smoke_test.sh ecsjobs:ci
