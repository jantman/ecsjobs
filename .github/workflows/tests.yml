name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push supersedes the run it interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Exact pin, not a floating major: astral-sh/setup-uv stopped publishing
      # major tags after v7, so `@v10` does not resolve.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"

      # --locked fails if uv.lock has drifted from pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check

      # Enforces 100% coverage (pyproject) and writes coverage.xml.
      - name: Test
        run: uv run pytest

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Build docs
        run: uv run sphinx-build -a -n -W -b html docs/source docs/build/html

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t ecsjobs:ci .

      - name: Smoke test
        run: dev/docker_smoke_test.sh ecsjobs:ci
